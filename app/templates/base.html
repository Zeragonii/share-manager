<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title or 'Share Manager' }}</title>
  <meta name="theme-color" content="#0f141c">
  <meta name="application-name" content="Share Manager">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Share Manager">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
</head>
<body>
<div class="mobile-topbar">
  <button type="button" class="mobile-nav-toggle ghost" aria-label="Open navigation" aria-controls="site-sidebar" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="mobile-brand">Share Manager <span>{{ app_version }}</span></div>
</div>
<div class="mobile-nav-overlay" hidden></div>
<div class="layout">
  <aside id="site-sidebar" aria-label="Sidebar navigation">
    <div class="aside-top">
      <div class="brand">Share Manager <span>{{ app_version }}</span></div>
      <button type="button" class="ghost aside-close" aria-label="Close navigation">×</button>
    </div>
    <nav>
      <a href="/">Dashboard</a><a href="/customers">Customers</a><a href="/packages">Packages</a><a href="/payments">Payments</a><a href="/integrations">Integrations</a><a href="/stream-limits">Stream Limits</a><a href="/backups">Backups</a>
    </nav>
    <form method="post" action="/logout"><button class="ghost">Sign out</button></form>
  </aside>
  <main>{% block content %}{% endblock %}</main>
</div>
<script>
(() => {
  const body = document.body;
  const toggle = document.querySelector('.mobile-nav-toggle');
  const closeButton = document.querySelector('.aside-close');
  const overlay = document.querySelector('.mobile-nav-overlay');
  const sidebar = document.getElementById('site-sidebar');
  const navLinks = sidebar ? [...sidebar.querySelectorAll('nav a')] : [];
  if (!toggle || !overlay || !sidebar) return;

  function setOpen(open) {
    body.classList.toggle('nav-open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    overlay.hidden = !open;
  }

  toggle.addEventListener('click', () => setOpen(!body.classList.contains('nav-open')));
  overlay.addEventListener('click', () => setOpen(false));
  closeButton?.addEventListener('click', () => setOpen(false));
  navLinks.forEach(link => link.addEventListener('click', () => setOpen(false)));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && body.classList.contains('nav-open')) setOpen(false);
  });
  window.addEventListener('resize', () => {
    if (window.innerWidth > 900 && body.classList.contains('nav-open')) setOpen(false);
  });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js', {scope: '/'}).catch(error => {
      console.warn('Share Manager service worker registration failed:', error);
    });
  });
}
</script>
</body>
</html>
