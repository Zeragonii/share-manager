<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title or 'Share Manager' }}</title>
  <meta name="theme-color" content="#0f141c">
  <meta name="application-name" content="Share Manager">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Share Manager">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/app.css?v={{ app_version }}">
</head>
<body>
<div class="mobile-topbar">
  <button type="button" class="mobile-nav-toggle ghost" aria-label="Open navigation" aria-controls="site-sidebar" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="mobile-brand">Share Manager <span>{{ app_version }}</span></div>
</div>
<div class="mobile-nav-overlay" hidden></div>
<div class="layout">
  <aside id="site-sidebar" aria-label="Sidebar navigation">
    <div class="aside-top">
      <div class="brand">Share Manager <span>{{ app_version }}</span></div>
      <button type="button" class="ghost aside-close" aria-label="Close navigation">×</button>
    </div>
    <nav>
      <a href="/" data-nav-root="/">Dashboard</a><a href="/customers" data-nav-root="/customers">Customers</a><a href="/tickets" data-nav-root="/tickets" class="nav-ticket-link"><span>Tickets</span><span class="nav-ticket-count" data-ticket-count aria-label="{{ admin_open_ticket_count }} active tickets" {% if not admin_open_ticket_count %}hidden{% endif %}>{{ admin_open_ticket_count }}</span></a><a href="/packages" data-nav-root="/packages">Packages</a><a href="/referrals" data-nav-root="/referrals">Referrals</a><a href="/payments" data-nav-root="/payments">Payments</a><a href="/news" data-nav-root="/news">News</a><a href="/integrations" data-nav-root="/integrations">Integrations</a><a href="/stream-limits" data-nav-root="/stream-limits">Stream Limits</a><a href="/backups" data-nav-root="/backups">Backups</a>
    </nav>
    <form method="post" action="/logout"><button class="ghost">Sign out</button></form>
  </aside>
  <main>{% block content %}{% endblock %}</main>
</div>
<nav class="mobile-bottom-nav" aria-label="Quick navigation">
  <a href="/" data-nav-root="/" aria-label="Dashboard">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6v-9h-6v9Zm0-16v5h6V4h-6Z"/></svg>
    <span>Dashboard</span>
  </a>
  <a href="/customers" data-nav-root="/customers" aria-label="Customers">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM8 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Zm8 1c-3.33 0-6 1.67-6 4v3h12v-3c0-2.33-2.67-4-6-4ZM8 14c-3.11 0-6 1.57-6 4v2h6v-3c0-1.08.42-2.06 1.15-2.89A8.4 8.4 0 0 0 8 14Z"/></svg>
    <span>Customers</span>
  </a>
  <a href="/payments" data-nav-root="/payments" aria-label="Payments">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4h13A2.5 2.5 0 0 1 21 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Zm2 2.5h14V7H5v2Zm0 3v5.5c0 .28.22.5.5.5h13a.5.5 0 0 0 .5-.5V12H5Zm2 3h5v2H7v-2Z"/></svg>
    <span>Payments</span>
  </a>
</nav>
<script>
(() => {
  const body = document.body;
  const toggle = document.querySelector('.mobile-nav-toggle');
  const closeButton = document.querySelector('.aside-close');
  const overlay = document.querySelector('.mobile-nav-overlay');
  const sidebar = document.getElementById('site-sidebar');
  const navLinks = sidebar ? [...sidebar.querySelectorAll('nav a')] : [];
  if (!toggle || !overlay || !sidebar) return;

  function setOpen(open) {
    body.classList.toggle('nav-open', open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    overlay.hidden = !open;
  }

  toggle.addEventListener('click', () => setOpen(!body.classList.contains('nav-open')));
  overlay.addEventListener('click', () => setOpen(false));
  closeButton?.addEventListener('click', () => setOpen(false));
  navLinks.forEach(link => link.addEventListener('click', () => setOpen(false)));
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && body.classList.contains('nav-open')) setOpen(false);
  });
  window.addEventListener('resize', () => {
    if (window.innerWidth > 900 && body.classList.contains('nav-open')) setOpen(false);
  });
})();
</script>
<script>
(() => {
  const path = window.location.pathname.replace(/\/$/, '') || '/';
  document.querySelectorAll('[data-nav-root]').forEach(link => {
    const root = link.dataset.navRoot;
    const active = root === '/' ? path === '/' : (path === root || path.startsWith(root + '/'));
    link.classList.toggle('active', active);
    if (active) link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
})();
</script>

<script>
(() => {
  const badge = document.querySelector('[data-ticket-count]');
  if (!badge) return;
  let inFlight = false;
  async function refreshTicketCount() {
    if (document.visibilityState !== 'visible' || inFlight) return;
    inFlight = true;
    try {
      const response = await fetch('/api/admin/tickets/summary', {credentials: 'same-origin', cache: 'no-store'});
      if (!response.ok) return;
      const data = await response.json();
      const count = Number(data.active_count || 0);
      const unread = Number(data.unread_count || 0);
      badge.textContent = String(count);
      badge.hidden = count === 0;
      badge.classList.toggle('has-unread', unread > 0);
      badge.setAttribute('aria-label', `${count} active tickets${unread ? `, ${unread} unread` : ''}`);
    } catch (_) {} finally { inFlight = false; }
  }
  refreshTicketCount();
  setInterval(refreshTicketCount, 10000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshTicketCount(); });
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js', {scope: '/'}).catch(error => {
      console.warn('Share Manager service worker registration failed:', error);
    });
  });
}
</script>
</body>
</html>
