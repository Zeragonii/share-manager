<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f141c">
<title>Share Manager unavailable</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#e8ecf3;background:#0b0f15}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0b0f15}
.card{width:min(440px,100%);background:#121823;border:1px solid #273244;border-radius:16px;padding:28px;text-align:center;box-shadow:0 18px 48px rgba(0,0,0,.28)}
img{width:96px;height:96px;border-radius:22px;margin-bottom:14px}h1{font-size:24px;margin:0 0 8px}p{color:#aab4c2;line-height:1.55;margin:0 0 20px}button{background:#e5a00d;border:0;color:#111;font-weight:800;padding:11px 16px;border-radius:8px;cursor:pointer}
</style>
</head>
<body><main class="card"><img src="/static/icons/icon-192.png" alt=""><h1>Share Manager is unreachable</h1><p>This app needs a live connection to Share Manager. No cached customer or billing data is shown while the server is unavailable.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
