services:
  app:
    build: .
    image: ${SHARE_MANAGER_IMAGE:-ghcr.io/zeragonii/share-manager:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://sharemanager:${DB_PASSWORD}@postgres:5432/sharemanager
      APP_SECRET: ${APP_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      RECONCILE_ON_ASSIGN: ${RECONCILE_ON_ASSIGN:-true}
      BILLING_CHECK_INTERVAL_MINUTES: ${BILLING_CHECK_INTERVAL_MINUTES:-15}
      NOTIFICATION_DUE_SOON_DAYS: ${NOTIFICATION_DUE_SOON_DAYS:-3}
      BACKUP_DIR: /backups
      BACKUP_SCHEDULE_HOUR: ${BACKUP_SCHEDULE_HOUR:-3}
      BACKUP_CHECK_INTERVAL_MINUTES: ${BACKUP_CHECK_INTERVAL_MINUTES:-5}
      BACKUP_RETENTION_DAILY: ${BACKUP_RETENTION_DAILY:-7}
      BACKUP_RETENTION_WEEKLY: ${BACKUP_RETENTION_WEEKLY:-4}
      BACKUP_RETENTION_MONTHLY: ${BACKUP_RETENTION_MONTHLY:-6}
    ports:
      - "8080:8080"
    volumes:
      - app_data:/data
      - ${BACKUP_HOST_PATH:-./backups}:/backups

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sharemanager
      POSTGRES_USER: sharemanager
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharemanager -d sharemanager"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_data:
  postgres_data:
